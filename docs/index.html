<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JE OS — template</title>
<link rel="icon" href="icon-192-v4.png">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,640;1,9..144,500&display=swap" rel="stylesheet">
<style>
  :root { --gold:#3ecfcf; --text:#f1ece4; --soft:#b4b8b2; --muted:#6a7370; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { min-height:100%; background:#000; color:var(--text); font-family:'Atkinson Hyperlegible',system-ui,sans-serif; }
  body::before { content:''; position:fixed; inset:0; background:#000 url('bg.jpg') right center / cover no-repeat; opacity:0.5; pointer-events:none; }
  main { position:relative; min-height:100dvh; padding:10vh 8vw 12vh; display:flex; align-items:flex-end; }
  .wrap { max-width:34rem; }
  h1 { font-family:'Fraunces',Georgia,serif; font-size:clamp(4.5rem,14vw,9rem); font-weight:640; letter-spacing:-0.055em; line-height:0.78; margin-bottom:18px; }
  h1 span { color:var(--gold); }
  .sub { font-size:1.05rem; color:var(--soft); font-style:italic; margin-bottom:28px; max-width:22em; }
  p { color:var(--soft); line-height:1.55; margin-bottom:1.1rem; max-width:34em; }
  a { color:var(--gold); }
  .meta { font-size:0.88rem; color:var(--muted); font-style:italic; }
</style>
</head>
<body>
<main>
  <div class="wrap">
    <h1>JE<span>.</span></h1>
    <p class="sub">A field notebook template. Not a live account.</p>
    <p>This page is only a preview of the look. The real app is private. Fork the repo, plug in your own Firebase project, and host it yourself.</p>
    <p class="meta"><a href="https://github.com/Joel-E7/JoelOS">github.com/Joel-E7/JoelOS</a></p>
  </div>
</main>
</body>
</html>
